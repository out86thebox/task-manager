
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Get Stuff Done</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">

        <h1>Get Stuff Done</h1>

        <p>Add your stuff, and get it done!</p>

        <div class="task-input">
            <label for="taskInput">New Stuffs</label>

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new stuff..."
            >

            <button id="addTaskBtn" type="button">
                Add Stuff
            </button>
        </div>

        <h2>My Stuffs</h2>

        <ul id="taskList"></ul>

    </main>

    <script src="script.js"></script>
</body>
</html>
